services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mergeproof
      POSTGRES_USER: mergeproof
      POSTGRES_PASSWORD: mergeproof
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mergeproof -d mergeproof"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mergeproof-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mergeproof-postgres:
